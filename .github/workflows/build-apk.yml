name: Build Android APK

on:
  push:
    branches:
      - phase3/market-data
      - fix/native-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (generate native Android project)
        working-directory: mobile
        run: npx expo prebuild -p android --clean --no-install

      - name: Fix Kotlin/Compose version mismatch
        working-directory: mobile/android
        run: |
          # Problem: root build.gradle sets kotlinVersion=1.9.25, so expo-modules-core
          # picks Compose Compiler 1.5.15. But the actual kotlin-gradle-plugin resolved
          # by Gradle is 1.9.24 (from react-native). Fix: pin kotlin plugin to 1.9.25.
          sed -i "s/classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')/classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')/" build.gradle
          echo "Pinned kotlin-gradle-plugin to 1.9.25 in build.gradle"
          grep "kotlin" build.gradle

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Find and rename APK
        run: |
          APK=$(find mobile/android -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" WealthMaster.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WealthMaster-APK
          path: WealthMaster.apk
          if-no-files-found: error
          retention-days: 90
