<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NT RMA" />
  <title>Neo Tokyo · Service / RMA</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Loading splash -->
  <div id="splash">
    <div class="splash-card">
      <img class="splash-logo" src="assets/neo_tokyo-logo.png" alt="Neo Tokyo" />
      <div class="splash-title">NEO TOKYO</div>
      <div class="splash-sub">SERVICE / RMA</div>
      <div class="splash-bar"><i></i></div>
    </div>
  </div>

  <!-- Drawer scrim + drawer -->
  <div id="drawer-scrim"></div>
  <aside id="drawer" aria-label="Main menu">
    <div class="drawer-head">
      <img src="assets/neo_tokyo-logo.png" alt="" />
      <div>
        <div class="t">NEO TOKYO</div>
        <div class="s">SERVICE / RMA</div>
      </div>
    </div>
    <div class="drawer-list" id="drawer-list"></div>
    <div class="drawer-foot">© NEO TOKYO · KOCHI</div>
  </aside>

  <!-- App shell -->
  <main id="app">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="14" y2="17"/>
        </svg>
      </button>
      <div class="brand">
        <img class="brand-mark" src="assets/neo_tokyo-logo.png" alt="" />
        <div>
          <div class="brand-name">NEO TOKYO</div>
          <div id="crumb" class="crumb">RMA / LOG</div>
        </div>
      </div>
      <div class="spacer"></div>
    </header>

    <!-- Section navigator -->
    <nav class="section-nav" aria-label="Sections">
      <div class="sn-card" data-section="service" role="button" tabindex="0">
        <span class="ico">⚙</span>
        <span class="lbl">SERVICE</span>
        <span class="stat">PLACEHOLDER</span>
        <span class="badge">SOON</span>
      </div>
      <div class="sn-card active" data-section="rma" role="button" tabindex="0">
        <span class="ico">⤶</span>
        <span class="lbl">RMA</span>
        <span class="stat">ACTIVE</span>
        <span class="badge">LIVE</span>
      </div>
      <div class="sn-card" data-section="warranty" role="button" tabindex="0">
        <span class="ico">✦</span>
        <span class="lbl">WARRANTY</span>
        <span class="stat">PLACEHOLDER</span>
        <span class="badge">SOON</span>
      </div>
    </nav>

    <!-- View -->
    <section id="view"></section>
  </main>

  <!-- FAB: quick new entry (only on RMA section) -->
  <button class="fab" id="fab" title="New entry" aria-label="New entry">＋</button>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- SheetJS via CDN (free) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- App scripts -->
  <script src="js/excel.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/rma.js"></script>
  <script src="js/rack.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('fab').addEventListener('click', () => NTApp.go('rma', 'new'));
  </script>
</body>
</html>
